{% extends 'base.html' %}

{% block title %}Supprimer un audio | SI-Archives{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-12 col-md-6">
            <div class="card border-0 shadow rounded-4 text-center p-4">
                <div class="p-3 rounded-circle bg-danger bg-opacity-10 text-danger d-inline-block mx-auto mb-3" style="width: 70px; height: 70px;">
                    <i class="bi bi-exclamation-triangle-fill fs-2"></i>
                </div>
                
                <h4 class="fw-bold mb-2">Confirmer la suppression</h4>
                <p class="text-secondary mb-4">
                    Êtes-vous sûr de vouloir supprimer définitivement l'audio : <br>
                    <strong class="text-body fs-5 d-block mt-2">"{{ audio.title }}"</strong>
                </p>

                <form method="POST" action="{% url 'delete_audio' audio.id %}">
                    {% csrf_token %}
                    <div class="d-flex justify-content-center gap-3">
                        <a href="{% url 'audio_management' %}" class="btn btn-light rounded-3 px-4">Annuler</a>
                        <button type="submit" class="btn btn-danger rounded-3 px-4">Confirmer et supprimer</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
